publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  build_runner: ^2.15.0
  cryptography: ^2.9.0
  drift: ^2.33.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  flutter_localizations:
    sdk: flutter
  flutter_native_splash: ^2.4.8
